[package]
name = "masterv-desktop"
version = "0.1.0"
description = "MasterV desktop client shell"
authors = ["MasterV"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

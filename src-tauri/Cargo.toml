[package]
name = "masterv-desktop"
version = "0.1.0"
description = "MasterV desktop client shell"
authors = ["MasterV"]
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
private-updater = ["dep:tauri-plugin-updater", "dep:serde_json"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde_json = { version = "1", optional = true }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

[package]
name = "masterv-desktop"
version = "0.1.0"
description = "MasterV desktop client shell"
authors = ["MasterV"]
edition = "2021"
rust-version = "1.85.0"

[features]
default = []
independent-updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
uuid = { version = "=1.24.1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

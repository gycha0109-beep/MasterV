name: Probe DIST2 serde lock

on:
  push:
    branches:
      - probe/dist2-serde-lock

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: probe/dist2-serde-lock
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Regenerate Cargo lock authority
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
      - name: Commit generated lockfile when changed
        run: |
          git diff -- src-tauri/Cargo.lock
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already authoritative"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "probe(dist2): regenerate serde updater lock"
          git push origin HEAD:probe/dist2-serde-lock

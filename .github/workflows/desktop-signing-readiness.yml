name: Desktop Signing Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to exercise through the signing dry-run
        required: true
        type: string
      allow_signing_dry_run:
        description: Exercise signing hooks without credentials, publication, or activation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signing-readiness:
    if: ${{ inputs.allow_signing_dry_run == true }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify exact-SHA authority
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); $requested='${{ inputs.source_sha }}'.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$' -or $actual -ne $requested) { throw "Exact-SHA mismatch requested=$requested actual=$actual" }
      - run: npm ci
      - run: npm run test:exit-3-clean-cut
      - run: npm run desktop:build
      - name: Require unsigned app in readiness-only stage
        shell: pwsh
        run: |
          $app=Resolve-Path 'src-tauri/target/release/masterv-desktop.exe'
          if ((Get-AuthenticodeSignature $app).Status.ToString() -ne 'NotSigned') { throw "Signing readiness must not activate a signing identity" }
      - name: Record readiness evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/desktop-signing-readiness | Out-Null
          [ordered]@{ status='MASTERV_SIGNING_READINESS_NO_ACTIVATION_PASS'; source_sha='${{ inputs.source_sha }}'; signing_activation=$false; credentials_used=$false; publication=$false } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/desktop-signing-readiness/readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-signing-readiness
          path: artifacts/desktop-signing-readiness
          if-no-files-found: error

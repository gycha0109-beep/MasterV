name: Desktop Signing Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to exercise through the 0.1.3 signing-boundary dry-run
        required: true
        type: string
      allow_signing_dry_run:
        description: Exercise signing boundary without credentials, publication, or activation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signing-readiness:
    if: ${{ inputs.allow_signing_dry_run == true }}
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify exact-SHA and no-signing-credential authority
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); $requested='${{ inputs.source_sha }}'.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$' -or $actual -ne $requested) { throw "Exact-SHA mismatch requested=$requested actual=$actual" }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { throw "Signing readiness dry-run must not receive the production Tauri private key" }
          if ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "Signing readiness dry-run must not receive the production Tauri key password" }
      - run: npm ci
      - run: npm run test:exit-3-clean-cut
      - run: npm run test:post-exit-1
      - name: Build updater-enabled unsigned 0.1.3 RC
        run: npm run desktop:build:windows-updater-rc
      - name: Require unsigned app and installer in readiness-only stage
        shell: pwsh
        run: |
          $app=Resolve-Path 'src-tauri/target/release/masterv-desktop.exe'
          $installer=Resolve-Path 'src-tauri/target/release/bundle/nsis/MasterV Desktop_0.1.3_x64-setup.exe'
          if ((Get-AuthenticodeSignature $app).Status.ToString() -ne 'NotSigned') { throw "Signing readiness must not activate an app signing identity" }
          if ((Get-AuthenticodeSignature $installer).Status.ToString() -ne 'NotSigned') { throw "Signing readiness must not activate an installer signing identity" }
          if (@(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.sig' -ErrorAction SilentlyContinue).Count -ne 0) { throw "Signing readiness dry-run must not create production updater signatures" }
      - name: Record readiness evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/desktop-signing-readiness | Out-Null
          [ordered]@{
            status='MASTERV_SIGNING_READINESS_NO_ACTIVATION_PASS'
            source_sha='${{ inputs.source_sha }}'
            target_version='0.1.3'
            updater_public_key_configured=$true
            signing_activation=$false
            credentials_used=$false
            tauri_signature_created=$false
            publication=$false
            next_stage='MV-REL-1'
          } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/desktop-signing-readiness/readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-0.1.3-signing-readiness
          path: artifacts/desktop-signing-readiness
          if-no-files-found: error

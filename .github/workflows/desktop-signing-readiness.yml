name: Desktop Signing Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to exercise through the signing integration dry-run
        required: true
        type: string
      allow_signing_dry_run:
        description: Explicitly exercise Tauri signing hooks without a signing provider, credentials, signature, publication, or activation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signing-readiness:
    if: ${{ inputs.allow_signing_dry_run == true }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
      NEXT_PUBLIC_MASTERV_API_BASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1
      MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
    steps:
      - name: Checkout explicit exact-SHA authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Establish signing source authority
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $requested = '${{ inputs.source_sha }}'.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be an exact 40-character commit SHA' }
          if ($actual -ne $requested) { throw "Exact-SHA checkout mismatch requested=$requested actual=$actual" }
          "MASTERV_SIGNING_SOURCE_SHA=$requested" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MASTERV_SIGNING_BASE_SHA=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MASTERV_SIGNING_SOURCE_AUTHORITY=explicit-exact-sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MASTERV_SIGNING_CHECKOUT_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run test:desktop-build-determinism
      - run: npm run test:desktop-release-readiness
      - run: node scripts/desktop-signing-readiness-contract.mjs
      - name: Verify locked Cargo graph
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps | Out-Null
      - name: Build native Windows signing-readiness executable
        run: npm run desktop:build
      - name: Verify native build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Generate platform icons for signing-readiness bundle
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Prepare dry-run signing evidence boundary
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/desktop-signing-readiness'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $log = Join-Path $dir 'signing-invocations.jsonl'
          if (Test-Path $log) { Remove-Item -Force $log }
          "MASTERV_SIGNING_MODE=dry-run" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MASTERV_SIGNING_INVOCATION_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare absolute-path Tauri signing config
        run: node scripts/prepare-windows-signing-config.mjs
      - name: Exercise Tauri signing integration without a live signing identity
        run: npm run tauri -- bundle --bundles nsis --config src-tauri/tauri.windows-signing-readiness.runtime.json
      - name: Verify signing-readiness build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Require dry-run application and installer to remain unsigned
        shell: pwsh
        run: |
          $app = Resolve-Path 'src-tauri/target/release/masterv-desktop.exe'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($installers.Count)" }
          $appStatus = (Get-AuthenticodeSignature $app).Status.ToString()
          $installerStatus = (Get-AuthenticodeSignature $installers[0].FullName).Status.ToString()
          if ($appStatus -ne 'NotSigned') { throw "3N dry-run app must remain unsigned; Authenticode status=$appStatus" }
          if ($installerStatus -ne 'NotSigned') { throw "3N dry-run installer must remain unsigned; Authenticode status=$installerStatus" }
          "MASTERV_SIGNING_APP_STATUS=$appStatus" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MASTERV_SIGNING_INSTALLER_STATUS=$installerStatus" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Audit and record signing-integration evidence
        run: node scripts/desktop-signing-readiness-audit-windows.mjs
      - name: Remove generated signing config
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue src-tauri/tauri.windows-signing-readiness.runtime.json
      - name: Upload signing-readiness evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-signing-readiness
          path: artifacts/desktop-signing-readiness
          if-no-files-found: error

name: Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      execution_ref:
        description: "Repository ref containing the code to smoke-test"
        required: true
        default: "feat/mvp-foundation"
      target:
        description: "Runtime smoke target"
        required: true
        type: choice
        default: search-ux-browser
        options:
          - search-ux-browser
          - youtube-discovery
          - gemini
      gemini_live_confirm:
        description: "Type RUN_GEMINI only when intentionally executing live Gemini"
        required: false
        default: ""
      query:
        description: "YouTube query for discovery or browser smoke"
        required: false
        default: "sunscreen review shorts"
      batch_job_name:
        description: "Existing batches/... name; hidden until paid-tier Batch is explicitly reopened"
        required: false
        default: ""
      batch_source_url:
        description: "Single public YouTube URL for guarded Batch smoke; currently blocked"
        required: false
        default: "https://www.youtube.com/watch?v=dr7rrnD_4jI"
      batch_model:
        description: "Gemini Batch model; Batch submit is hidden until paid-tier precondition is verified"
        required: false
        default: "gemini-3.5-flash-lite"

jobs:
  gemini-confirmation-guard:
    if: ${{ inputs.target == 'gemini' && inputs.gemini_live_confirm != 'RUN_GEMINI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block unconfirmed live Gemini smoke
        run: |
          echo "Live Gemini smoke blocked: set gemini_live_confirm=RUN_GEMINI intentionally."
          exit 1

  gemini-smoke:
    if: ${{ inputs.target == 'gemini' && inputs.gemini_live_confirm == 'RUN_GEMINI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify Gemini secret exists
        run: test -n "$GEMINI_API_KEY"
      - name: Run live Gemini YouTube analysis
        run: npm run smoke:gemini

  youtube-discovery-smoke:
    if: ${{ inputs.target == 'youtube-discovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      YOUTUBE_DISCOVERY_SMOKE_QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify YouTube secret exists
        run: test -n "$YOUTUBE_DATA_API_KEY"
      - name: Run one-shot YouTube discovery smoke
        run: npm run smoke:youtube-discovery
      - name: Upload YouTube discovery smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-discovery-smoke
          path: artifacts/youtube-discovery-smoke.json
          if-no-files-found: error

  search-ux-browser-smoke:
    if: ${{ inputs.target == 'search-ux-browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      SEARCH_UX_BROWSER_QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify browser smoke preconditions
        run: |
          test -n "$YOUTUBE_DATA_API_KEY"
          test -z "${GEMINI_API_KEY:-}"
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
      - name: Ensure Korean screenshot font
        run: |
          if ! fc-list :lang=ko | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          fc-list :lang=ko | head -n 3
      - name: Build production app
        run: npm run build
      - name: Start production app without Gemini credentials
        run: |
          mkdir -p artifacts/search-ux-browser
          npm run start -- -H 127.0.0.1 -p 3000 > artifacts/search-ux-browser/server.log 2>&1 &
          echo $! > /tmp/masterv-next.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/search-ux-browser/server.log
          exit 1
      - name: Run live Search UX browser smoke
        run: npm run smoke:search-ux-browser
      - name: Upload Search UX browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-ux-browser-smoke
          path: artifacts/search-ux-browser
          if-no-files-found: error
      - name: Stop production app
        if: always()
        run: |
          if test -f /tmp/masterv-next.pid; then
            kill "$(cat /tmp/masterv-next.pid)" || true
          fi

  gemini-batch-submit:
    if: ${{ inputs.target == 'gemini-batch-submit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BACKGROUND_BATCH_MODE: submit
      BACKGROUND_BATCH_SOURCE_URL: ${{ inputs.batch_source_url }}
      BACKGROUND_BATCH_MODEL: ${{ inputs.batch_model }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify Gemini secret exists
        run: test -n "$GEMINI_API_KEY"
      - name: Submit exactly one guarded Gemini Batch job
        run: npm run smoke:background-batch
      - name: Upload Gemini Batch smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-batch-smoke-submit
          path: artifacts/background-batch-smoke.json
          if-no-files-found: warn

  gemini-batch-check:
    if: ${{ inputs.target == 'gemini-batch-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BACKGROUND_BATCH_MODE: check
      BACKGROUND_BATCH_JOB_NAME: ${{ inputs.batch_job_name }}
      BACKGROUND_BATCH_SOURCE_URL: ${{ inputs.batch_source_url }}
      BACKGROUND_BATCH_MODEL: ${{ inputs.batch_model }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify required check inputs
        run: test -n "$GEMINI_API_KEY" && test -n "$BACKGROUND_BATCH_JOB_NAME"
      - name: Check existing Gemini Batch job without creating another
        run: npm run smoke:background-batch
      - name: Upload Gemini Batch check artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-batch-smoke-check
          path: artifacts/background-batch-smoke.json
          if-no-files-found: warn

name: Real Product Shorts Pilot

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify secret exists
        run: test -n "$GEMINI_API_KEY"
      - name: Analyze real product Shorts corpus
        run: npm run pilot:real-products
      - name: Upload pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-product-pilot-report
          path: |
            artifacts/real-product-pilot.json
            artifacts/analysis-replay-deep.json
          if-no-files-found: error

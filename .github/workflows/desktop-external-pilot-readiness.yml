name: Desktop External Pilot Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to validate for a private external pilot
        required: true
        type: string
      allow_pilot_readiness:
        description: Build and validate pilot evidence only; no distribution or publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pilot-readiness:
    if: ${{ inputs.allow_pilot_readiness == true }}
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify exact-SHA authority
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); $requested='${{ inputs.source_sha }}'.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$' -or $actual -ne $requested) { throw "Exact-SHA mismatch requested=$requested actual=$actual" }
      - run: npm ci
      - run: npm run test:exit-3-clean-cut
      - run: npm run desktop:build
      - run: npm run test:desktop-windows-runtime
      - run: npm run tauri -- icon src-tauri/icons/icon.png
      - run: npm run desktop:bundle:windows-smoke
      - run: npm run test:desktop-installed-clean-cut-windows
      - name: Record pilot-readiness boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/desktop-external-pilot-readiness | Out-Null
          [ordered]@{ status='MASTERV_EXTERNAL_PILOT_READINESS_PASS'; source_sha='${{ inputs.source_sha }}'; distribution=$false; publication=$false; signing_activation=$false } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/desktop-external-pilot-readiness/readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-external-pilot-readiness
          path: |
            artifacts/desktop-external-pilot-readiness
            artifacts/desktop-windows-clean-cut
            artifacts/desktop-installed-clean-cut
          if-no-files-found: error

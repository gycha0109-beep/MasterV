name: Desktop External Pilot Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to validate for a private external pilot
        required: true
        type: string
      allow_pilot_readiness:
        description: Build and validate unsigned 0.1.3 pilot evidence only; no distribution or publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pilot-readiness:
    if: ${{ inputs.allow_pilot_readiness == true }}
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify exact-SHA authority
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); $requested='${{ inputs.source_sha }}'.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$' -or $actual -ne $requested) { throw "Exact-SHA mismatch requested=$requested actual=$actual" }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { throw "Pilot readiness must remain unsigned before MV-REL-1" }
      - run: npm ci
      - run: npm run test:exit-3-clean-cut
      - run: npm run test:post-exit-1
      - name: Build updater-enabled unsigned 0.1.3 pilot RC
        run: npm run desktop:build:windows-updater-rc
      - run: npm run test:desktop-windows-runtime
      - run: npm run test:desktop-installed-clean-cut-windows
      - name: Record pilot-readiness boundary
        shell: pwsh
        run: |
          $installer=Get-Item "src-tauri/target/release/bundle/nsis/MasterV Desktop_0.1.3_x64-setup.exe"
          if ((Get-AuthenticodeSignature $installer.FullName).Status.ToString() -ne 'NotSigned') { throw "Pilot readiness candidate unexpectedly signed" }
          if (@(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.sig" -ErrorAction SilentlyContinue).Count -ne 0) { throw "Pilot readiness unexpectedly produced a Tauri updater signature" }
          New-Item -ItemType Directory -Force -Path artifacts/desktop-external-pilot-readiness | Out-Null
          [ordered]@{
            status='MASTERV_EXTERNAL_PILOT_READINESS_PASS'
            source_sha='${{ inputs.source_sha }}'
            target_version='0.1.3'
            updater_enabled=$true
            distribution=$false
            publication=$false
            signing_activation=$false
          } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/desktop-external-pilot-readiness/readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-external-pilot-readiness-0.1.3
          path: |
            artifacts/desktop-external-pilot-readiness
            artifacts/desktop-windows-clean-cut
            artifacts/desktop-installed-clean-cut
            src-tauri/target/release/bundle/nsis/MasterV Desktop_0.1.3_x64-setup.exe
          if-no-files-found: error

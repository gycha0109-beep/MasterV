name: Coarse Bundle Calibration

on:
  workflow_dispatch:
    inputs:
      bundle_sizes:
        description: Comma-separated bundle sizes
        required: false
        default: "1,2,4"
      fixture_offset:
        description: Zero-based fixture offset
        required: false
        default: "0"
      fixture_limit:
        description: Number of fixtures to calibrate
        required: false
        default: "8"
  push:
    branches:
      - feat/mvp-foundation
    paths:
      - .github/workflows/coarse-bundle-calibration.yml

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUNDLE_SIZES: ${{ inputs.bundle_sizes || '1,2,4' }}
      FIXTURE_OFFSET: ${{ inputs.fixture_offset || '0' }}
      FIXTURE_LIMIT: ${{ inputs.fixture_limit || '8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify secret exists
        run: test -n "$GEMINI_API_KEY"
      - name: Run staged coarse bundle calibration
        run: npm run calibrate:coarse-bundles
      - name: Upload calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coarse-bundle-calibration-report
          path: artifacts/coarse-bundle-calibration.json
          if-no-files-found: error

# Bootstrap push trigger retained only for the staged MV-ARCH-1C run.

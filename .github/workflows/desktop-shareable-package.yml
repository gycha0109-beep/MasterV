name: Desktop Shareable Package

on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to build as a private unsigned share package
        required: false
        type: string
      allow_private_package:
        description: Explicitly allow building a private unsigned share package only; this does not upload to Drive, email anyone, publish, or activate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  private-share-package:
    if: ${{ github.event_name == 'pull_request' || inputs.allow_private_package == true }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
      NEXT_PUBLIC_MASTERV_API_BASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1
      MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
      SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
      SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
    steps:
      - name: Checkout PR synthetic merge authority
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout explicit exact-SHA authority
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Establish private-share source authority
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $requested = '${{ inputs.source_sha }}'.Trim()
            if ($requested -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be an exact 40-character commit SHA' }
            if ($actual -ne $requested) { throw "Exact-SHA checkout mismatch requested=$requested actual=$actual" }
            "MASTERV_SHARE_SOURCE_SHA=$requested" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MASTERV_SHARE_BASE_SHA=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MASTERV_SHARE_SOURCE_AUTHORITY=explicit-exact-sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "MASTERV_SHARE_SOURCE_SHA=${{ github.event.pull_request.head.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MASTERV_SHARE_BASE_SHA=${{ github.event.pull_request.base.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MASTERV_SHARE_SOURCE_AUTHORITY=pr-synthetic-merge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "MASTERV_SHARE_CHECKOUT_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run test:desktop-build-determinism
      - run: npm run test:desktop-release-readiness
      - run: npm run test:desktop-shareable-package
      - name: Verify installed-runtime test preconditions
        shell: pwsh
        run: |
          if (-not $env:SUPABASE_TEST_EMAIL) { throw "SUPABASE_TEST_EMAIL is required" }
          if (-not $env:SUPABASE_TEST_PASSWORD) { throw "SUPABASE_TEST_PASSWORD is required" }
          if ($env:GEMINI_API_KEY) { throw "Gemini credential must not be present in 3O private-share verification" }
          if ($env:YOUTUBE_DATA_API_KEY) { throw "YouTube credential must not be present in 3O private-share verification" }
      - name: Verify locked Cargo graph
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps | Out-Null
      - name: Build native Windows share-candidate executable
        run: npm run desktop:build
      - name: Verify native build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Generate platform icons for private share candidate
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build formal unsigned NSIS private share candidate
        run: npm run desktop:bundle:windows-release-candidate
      - name: Verify private share build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Require unsigned Authenticode state
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($installers.Count)" }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          $status = $signature.Status.ToString()
          if ($status -ne 'NotSigned') { throw "3O private share candidate must remain unsigned; Authenticode status=$status" }
          "MASTERV_SHARE_SIGNATURE_STATUS=$status" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Materialize private share handoff package
        run: npm run desktop:prepare:shareable-package-windows
      - name: Verify packaged copy Authenticode state
        shell: pwsh
        run: |
          $packaged = @(Get-ChildItem artifacts/desktop-shareable-package/MasterV-v*/MasterV_*_x64-setup.exe)
          if ($packaged.Count -ne 1) { throw "Expected exactly one packaged NSIS setup executable, found $($packaged.Count)" }
          $signature = Get-AuthenticodeSignature $packaged[0].FullName
          $status = $signature.Status.ToString()
          if ($status -ne 'NotSigned') { throw "3O packaged copy must remain unsigned; Authenticode status=$status" }
          $sha = (Get-FileHash -LiteralPath $packaged[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = [ordered]@{
            status = 'MASTERV_PACKAGED_AUTHENTICODE_CHECK_PASS'
            installer = $packaged[0].Name
            sha256 = $sha
            signature_status = $status
          } | ConvertTo-Json
          $record | Set-Content -LiteralPath artifacts/desktop-shareable-package/packaged-authenticode-evidence.json -Encoding utf8
      - name: Install and audit the exact packaged candidate
        run: npm run test:desktop-installed-prepare-windows
      - name: Verify installed restart, logout, and uninstall lifecycle
        run: npm run test:desktop-installed-session-uninstall-windows
      - name: Close private share package evidence
        run: npm run test:desktop-shareable-package-audit-windows
      - name: Upload private share package and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-private-share-package
          path: |
            artifacts/desktop-shareable-package
            artifacts/desktop-installed-quality
          if-no-files-found: error

name: MasterV Windows Shareable Package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shareable-package:
    name: windows-shareable-package
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
      NEXT_PUBLIC_MASTERV_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_MASTERV_API_BASE_URL || 'https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1' }}
      MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install dependencies
        run: npm ci
      - name: Verify 0.1.2 migration bridge build preconditions
        shell: pwsh
        run: |
          if (-not $env:NEXT_PUBLIC_SUPABASE_URL) { throw "NEXT_PUBLIC_SUPABASE_URL is required for the 0.1.2 migration bridge build" }
          if (-not $env:NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY) { throw "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is required for the 0.1.2 migration bridge build" }
          if (-not $env:NEXT_PUBLIC_MASTERV_API_BASE_URL) { throw "NEXT_PUBLIC_MASTERV_API_BASE_URL is required for the 0.1.2 migration bridge build" }
          if ($env:GEMINI_API_KEY) { throw "Gemini credential must not be present in desktop runtime smoke" }
          if ($env:YOUTUBE_DATA_API_KEY) { throw "YouTube credential must not be present in desktop runtime smoke" }
          if ($env:POLAR_ACCESS_TOKEN) { throw "Polar server credential must not be present in desktop runtime smoke" }
          if ($env:SUPABASE_SERVICE_ROLE_KEY) { throw "Supabase admin credential must not be present in desktop runtime smoke" }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { throw "Updater signing private key must not be present in unsigned shareable package validation" }
      - name: Verify runtime dependency baseline
        run: npm run test:runtime-api
      - name: Verify deterministic Desktop build contract
        run: npm run test:desktop-build-determinism
      - name: Verify release readiness contract
        run: npm run test:desktop-release-readiness
      - name: Verify shareable package contract
        run: npm run test:desktop-shareable-package
      - name: Verify installed quality contract
        run: npm run test:desktop-installed-quality-contract
      - name: Verify locked Cargo graph
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps | Out-Null
      - name: Build native Windows share-candidate executable
        run: npm run desktop:build
      - name: Verify native build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Run local-first Windows runtime smoke
        run: npm run test:desktop-windows-runtime
      - name: Generate platform icons for unsigned installer smoke
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build unsigned NSIS installer smoke
        run: npm run desktop:bundle:windows-smoke
      - name: Verify installer build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Install and audit unsigned NSIS quality candidate
        run: npm run test:desktop-installed-prepare-windows
      - name: Run installed local-first restart and uninstall smoke
        run: npm run test:desktop-installed-session-uninstall-windows
      - name: Upload unsigned Windows share-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-share-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/desktop-windows-runtime
            artifacts/desktop-installed-quality
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

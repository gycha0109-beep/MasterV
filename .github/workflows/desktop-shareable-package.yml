name: Desktop Shareable Package

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to package privately
        required: true
        type: string
      allow_private_package:
        description: Build a private unsigned package only; no publication or activation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  private-share-package:
    if: ${{ inputs.allow_private_package == true }}
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify exact-SHA authority
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); $requested='${{ inputs.source_sha }}'.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$' -or $actual -ne $requested) { throw "Exact-SHA mismatch requested=$requested actual=$actual" }
      - run: npm ci
      - run: npm run test:exit-3-clean-cut
      - run: npm run desktop:build
      - run: npm run tauri -- icon src-tauri/icons/icon.png
      - run: npm run desktop:bundle:windows-smoke
      - name: Require unsigned private package
        shell: pwsh
        run: |
          $installers=@(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one installer" }
          if ((Get-AuthenticodeSignature $installers[0].FullName).Status.ToString() -ne 'NotSigned') { throw "Private package unexpectedly signed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-private-share
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

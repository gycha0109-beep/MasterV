name: Desktop Updater Dependency Probe

on:
  push:
    branches:
      - probe/mv-dist-2-updater-deps

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[deps-frozen]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: npm ci
      - name: Let Tauri CLI add updater plugin
        run: npm run tauri add updater
      - name: Freeze generated Rust updater dependency graph on probe branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(dist2): freeze updater rust deps [deps-frozen]"
          git push origin HEAD:probe/mv-dist-2-updater-deps

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/mvp-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:observation-contract
      - run: npm run test:derived-metrics
      - run: npm run test:reference-compare
      - run: npm run test:evidence-rules
      - run: npm run test:production-concepts
      - run: npm run test:prompt-packs
      - run: npm run build

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/mvp-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:observation-contract
      - run: npm run test:subject-attribution
      - run: npm run test:derived-metrics
      - run: npm run test:reference-compare
      - run: npm run test:evidence-rules
      - run: npm run test:production-concepts
      - run: npm run test:prompt-packs
      - run: npm run test:single-video-production
      - run: npm run test:reference-adaptation
      - run: npm run test:gemini-rate-limit
      - run: npm run test:tiered-analysis
      - run: npm run test:source-identity
      - run: npm run test:analysis-cache
      - run: npm run test:analysis-budget
      - run: npm run test:youtube-discovery
      - run: npm run test:search-ux
      - run: npm run test:background-batch
      - run: npm run test:reference-library
      - run: npm run test:reference-library-supabase
      - run: npm run test:supabase-auth
      - run: npm run test:runtime-api
      - run: npm run test:desktop-shell
      - run: npm run test:desktop-reference-library
      - run: npm run test:desktop-reference-detail-compare
      - run: npm run test:reference-library-browser-script
      - run: npm run test:search-ux-browser-script
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  desktop-shell:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
      NEXT_PUBLIC_MASTERV_API_BASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1
      MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run test:desktop-shell
      - run: npm run test:desktop-reference-library
      - run: npm run test:desktop-reference-detail-compare
      - run: npm run desktop:build

  desktop-windows-runtime:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
      NEXT_PUBLIC_MASTERV_API_BASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1
      MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
      SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
      SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Verify Windows desktop smoke preconditions
        shell: pwsh
        run: |
          if (-not $env:SUPABASE_TEST_EMAIL) { throw "SUPABASE_TEST_EMAIL is required" }
          if (-not $env:SUPABASE_TEST_PASSWORD) { throw "SUPABASE_TEST_PASSWORD is required" }
          if ($env:GEMINI_API_KEY) { throw "Gemini credential must not be present in desktop runtime smoke" }
          if ($env:YOUTUBE_DATA_API_KEY) { throw "YouTube credential must not be present in desktop runtime smoke" }
      - name: Build native Windows Tauri executable
        run: npm run desktop:build
      - name: Run native WebView2 Reference Library runtime smoke
        run: npm run test:desktop-windows-runtime
      - name: Run native WebView2 Reference Detail Compare runtime smoke
        run: npm run test:desktop-reference-detail-compare-windows
      - name: Generate platform icons for installer smoke
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build unsigned NSIS installer smoke
        run: npm run desktop:bundle:windows-smoke
      - name: Upload Windows desktop runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterv-windows-desktop-smoke
          path: |
            artifacts/desktop-windows-runtime
            artifacts/desktop-reference-detail-compare
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

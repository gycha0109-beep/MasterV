name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:observation-contract
      - run: npm run test:subject-attribution
      - run: npm run test:derived-metrics
      - run: npm run test:reference-compare
      - run: npm run test:evidence-rules
      - run: npm run test:production-concepts
      - run: npm run test:prompt-packs
      - run: npm run test:single-video-production
      - run: npm run test:reference-adaptation
      - run: npm run test:gemini-rate-limit
      - run: npm run test:tiered-analysis
      - run: npm run test:source-identity
      - run: npm run test:analysis-cache
      - run: npm run test:analysis-budget
      - run: npm run test:youtube-discovery
      - run: npm run test:search-ux
      - run: npm run test:background-batch
      - run: npm run test:reference-library
      - run: npm run test:runtime-api
      - run: npm run test:desktop-shell
      - run: npm run test:desktop-reference-library
      - run: npm run test:desktop-reference-detail-compare
      - run: npm run test:exit-3-clean-cut
      - run: npm run test:post-exit-1
      - run: npm run test:rel-1
      - run: npm run test:rel-1b
      - run: npm run test:search-ux-browser-script
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  desktop-shell:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: npm ci
      - run: npm run test:exit-3-clean-cut
      - run: npm run test:desktop-shell
      - name: Verify locked Cargo graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null
      - name: Run native Local SQLite tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml local_persistence::tests
      - name: Run native automatic backup tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml automatic_backup::tests
      - run: npm run desktop:build
      - name: Verify desktop build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

  desktop-signing-readiness:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/desktop-signing-readiness.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      allow_signing_dry_run: true

  desktop-windows-runtime:
    name: desktop-windows-quality
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: npm ci
      - name: Verify clean-cut Windows runtime preconditions
        shell: pwsh
        run: |
          if ($env:GEMINI_API_KEY) { throw "Gemini credential must not be present in desktop runtime smoke" }
          if ($env:YOUTUBE_DATA_API_KEY) { throw "YouTube credential must not be present in desktop runtime smoke" }
          if ($env:POLAR_ACCESS_TOKEN) { throw "Polar server credential must not be present in desktop runtime smoke" }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { throw "Production Tauri signing key must not be present in MV-POST-EXIT-1 dry-run" }
      - run: npm run test:exit-3-clean-cut
      - run: npm run test:post-exit-1
      - run: npm run test:rel-1b
      - name: Verify locked Cargo graph
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps | Out-Null
      - name: Build native Windows Tauri executable
        run: npm run desktop:build
      - name: Verify native build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Run native clean-cut Windows runtime smoke
        run: npm run test:desktop-windows-runtime
      - name: Generate platform icons for installer smoke
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build unsigned NSIS installer smoke
        run: npm run desktop:bundle:windows-smoke
      - name: Verify installer build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Install, run, restart, and uninstall clean-cut candidate
        run: npm run test:desktop-installed-clean-cut-windows
      - name: Build unsigned 0.1.2 updater baseline
        run: npm run desktop:build:windows-updater-baseline
      - name: Build unsigned 0.1.3 updater RC
        run: npm run desktop:build:windows-updater-rc
      - name: Verify 0.1.2 to 0.1.3 Local SQLite upgrade survival
        run: npm run test:desktop-upgrade-dry-run-windows
      - name: Verify RC build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Verify MV-POST-EXIT-1 artifacts remain unsigned
        shell: pwsh
        run: |
          $baseline=Get-Item "src-tauri/target/release/bundle/nsis/MasterV Desktop_0.1.2_x64-setup.exe"
          $candidate=Get-Item "src-tauri/target/release/bundle/nsis/MasterV Desktop_0.1.3_x64-setup.exe"
          foreach ($installer in @($baseline,$candidate)) {
            if ((Get-AuthenticodeSignature $installer.FullName).Status.ToString() -ne 'NotSigned') { throw "MV-POST-EXIT-1 installer unexpectedly signed: $($installer.Name)" }
          }
          if (@(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.sig" -ErrorAction SilentlyContinue).Count -ne 0) { throw "MV-POST-EXIT-1 dry-run created a production updater signature" }
      - name: Upload Windows RC readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-post-exit-1-rc-readiness
          path: |
            artifacts/desktop-windows-clean-cut
            artifacts/desktop-installed-clean-cut
            artifacts/desktop-post-exit-1-upgrade
            src-tauri/target/release/bundle/nsis/MasterV Desktop_0.1.2_x64-setup.exe
            src-tauri/target/release/bundle/nsis/MasterV Desktop_0.1.3_x64-setup.exe
          if-no-files-found: warn
      - name: Build unsigned 0.1.4 updater bootstrap hotfix RC
        run: npm run desktop:build:windows-updater-hotfix-rc
      - name: Verify hotfix RC build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Verify 0.1.4 updater UI bootstrap wiring on Windows
        run: npm run test:desktop-rel-1b-hotfix-windows
      - name: Upload MV-REL-1B hotfix RC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-0.1.4-rel-1b-hotfix-rc
          path: |
            artifacts/desktop-rel-1b-hotfix
            src-tauri/target/release/bundle/nsis/MasterV Desktop_0.1.4_x64-setup.exe
          if-no-files-found: warn

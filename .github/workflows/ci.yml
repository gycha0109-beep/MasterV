name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/mvp-foundation

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:observation-contract
      - run: npm run test:subject-attribution
      - run: npm run test:derived-metrics
      - run: npm run test:reference-compare
      - run: npm run test:evidence-rules
      - run: npm run test:production-concepts
      - run: npm run test:prompt-packs
      - run: npm run test:single-video-production
      - run: npm run test:reference-adaptation
      - run: npm run test:gemini-rate-limit
      - run: npm run test:tiered-analysis
      - run: npm run test:source-identity
      - run: npm run test:analysis-cache
      - run: npm run test:analysis-budget
      - run: npm run test:youtube-discovery
      - run: npm run test:search-ux
      - run: npm run test:background-batch
      - run: npm run test:reference-library
      - run: npm run test:reference-library-supabase
      - run: npm run test:supabase-auth
      - run: npm run test:runtime-api
      - run: npm run test:desktop-shell
      - run: npm run test:desktop-reference-library
      - run: npm run test:desktop-reference-detail-compare
      - run: npm run test:hosted-reference-compiler
      - run: npm run test:hosted-youtube-discovery
      - run: npm run test:hosted-deep-analysis
      - run: npm run test:hosted-production-guidance
      - run: npm run test:hosted-background-batch
      - run: npm run test:desktop-build-determinism
      - run: npm run test:reference-library-browser-script
      - run: npm run test:search-ux-browser-script
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  desktop-shell:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
      NEXT_PUBLIC_MASTERV_API_BASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1
      MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: npm ci
      - run: npm run test:desktop-shell
      - run: npm run test:desktop-reference-library
      - run: npm run test:desktop-reference-detail-compare
      - run: npm run test:hosted-reference-compiler
      - run: npm run test:hosted-youtube-discovery
      - run: npm run test:hosted-deep-analysis
      - run: npm run test:hosted-production-guidance
      - run: npm run test:hosted-background-batch
      - run: npm run test:desktop-build-determinism
      - name: Verify locked Cargo graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null
      - run: npm run desktop:build
      - name: Verify desktop build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

  desktop-windows-runtime:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
      NEXT_PUBLIC_MASTERV_API_BASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1
      MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
      SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
      SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: npm ci
      - name: Verify Windows desktop smoke preconditions
        shell: pwsh
        run: |
          if (-not $env:SUPABASE_TEST_EMAIL) { throw "SUPABASE_TEST_EMAIL is required" }
          if (-not $env:SUPABASE_TEST_PASSWORD) { throw "SUPABASE_TEST_PASSWORD is required" }
          if ($env:GEMINI_API_KEY) { throw "Gemini credential must not be present in desktop runtime smoke" }
          if ($env:YOUTUBE_DATA_API_KEY) { throw "YouTube credential must not be present in desktop runtime smoke" }
      - name: Verify locked Cargo graph
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps | Out-Null
      - name: Build native Windows Tauri executable
        run: npm run desktop:build
      - name: Verify native build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Run native WebView2 Reference Library runtime smoke
        run: npm run test:desktop-windows-runtime
      - name: Run native WebView2 Reference Detail Compare regression smoke
        run: npm run test:desktop-reference-detail-compare-windows
      - name: Run native WebView2 Canonical Reference Compiler runtime smoke
        run: npm run test:desktop-reference-compiler-windows
      - name: Run native WebView2 Hosted YouTube Discovery runtime smoke
        run: npm run test:desktop-youtube-discovery-windows
      - name: Run native WebView2 Guarded Background Batch runtime smoke
        run: npm run test:desktop-background-batch-windows
      - name: Generate platform icons for installer smoke
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build unsigned NSIS installer smoke
        run: npm run desktop:bundle:windows-smoke
      - name: Verify installer build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Run native WebView2 Hosted Deep Analysis runtime smoke
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $lines = @()
            & npm run test:desktop-deep-analysis-windows 2>&1 | Tee-Object -Variable lines | Write-Host
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { break }
            $text = ($lines | Out-String)
            $retryable = $text -match '요청 한도에 도달했습니다|재시도 힌트|\b429\b'
            if (-not $retryable -or $attempt -eq $maxAttempts) { exit $exitCode }
            $waitSeconds = 15
            if ($text -match '([0-9]+)초 재시도 힌트') { $waitSeconds = [int]$Matches[1] + 3 }
            $waitSeconds = [Math]::Min([Math]::Max($waitSeconds, 10), 65)
            Write-Host "MASTERV_CI_PROVIDER_RATE_LIMIT_RETRY smoke=3H attempt=$attempt wait_seconds=$waitSeconds"
            Start-Sleep -Seconds $waitSeconds
          }
      - name: Run native WebView2 Product Truth Production Guidance runtime smoke
        shell: pwsh
        run: |
          Start-Sleep -Seconds 10
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $lines = @()
            & npm run test:desktop-production-guidance-windows 2>&1 | Tee-Object -Variable lines | Write-Host
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { break }
            $text = ($lines | Out-String)
            $retryable = $text -match '요청 한도에 도달했습니다|재시도 힌트|\b429\b|3I prerequisite Deep Analysis failed:\s*at main'
            if (-not $retryable -or $attempt -eq $maxAttempts) { exit $exitCode }
            $waitSeconds = 15
            if ($text -match '([0-9]+)초 재시도 힌트') { $waitSeconds = [int]$Matches[1] + 3 }
            $waitSeconds = [Math]::Min([Math]::Max($waitSeconds, 10), 65)
            Write-Host "MASTERV_CI_PROVIDER_RATE_LIMIT_RETRY smoke=3I attempt=$attempt wait_seconds=$waitSeconds"
            Start-Sleep -Seconds $waitSeconds
          }
      - name: Upload Windows desktop runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-desktop-smoke
          path: |
            artifacts/desktop-windows-runtime
            artifacts/desktop-reference-detail-compare
            artifacts/desktop-reference-compiler
            artifacts/desktop-youtube-discovery
            artifacts/desktop-deep-analysis
            artifacts/desktop-production-guidance
            artifacts/desktop-background-batch
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

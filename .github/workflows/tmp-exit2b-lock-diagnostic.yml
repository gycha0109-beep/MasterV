name: TMP Exit2B Lock Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  resolve-and-publish-scratch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Resolve full Cargo graph without lock guard
        run: cargo metadata --manifest-path src-tauri/Cargo.toml >/dev/null
      - name: Verify generated graph is now lockable
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml >/dev/null
      - name: Publish generated lock to scratch ref
        run: |
          test -n "$(git status --porcelain -- src-tauri/Cargo.lock)"
          test -z "$(git status --porcelain | grep -v 'src-tauri/Cargo.lock' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/Cargo.lock
          git commit -m 'chore(tmp): publish resolved exit-2b Cargo.lock'
          git push --force origin HEAD:tmp-never-create

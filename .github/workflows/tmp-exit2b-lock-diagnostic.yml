name: TMP Exit2B Lock Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Resolve full Cargo graph without lock guard
        run: cargo metadata --manifest-path src-tauri/Cargo.toml >/dev/null
      - name: Print exact Cargo.lock delta
        run: |
          echo '===LOCK-DIFF-BEGIN==='
          git diff -- src-tauri/Cargo.lock
          echo '===LOCK-DIFF-END==='
          test -n "$(git status --porcelain -- src-tauri/Cargo.lock)"
          exit 1

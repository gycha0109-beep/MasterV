name: Desktop Independent Updater Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  bootstrap:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: npm ci
      - name: Verify locked updater dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps | Out-Null
      - name: Verify independent updater contract
        run: node scripts/desktop-independent-updater-contract.mjs
      - name: Build one-time independent updater bootstrap installer
        run: npm run tauri -- build --features independent-updater --bundles nsis --config src-tauri/tauri.windows-updater-bootstrap.conf.json
      - name: Verify installed independent updater bootstrap launch and uninstall
        run: node scripts/desktop-independent-updater-installed-launch-windows.mjs
      - name: Verify bootstrap installer authority
        shell: pwsh
        run: |
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/MasterV_0.1.1_x64-setup.exe"
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") { throw "Bootstrap Authenticode status must remain NotSigned until Windows signing is explicitly activated" }
          $sigFiles = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.sig" -ErrorAction SilentlyContinue)
          if ($sigFiles.Count -ne 0) { throw "Bootstrap build must not create updater release artifacts" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path artifacts/desktop-independent-updater-bootstrap | Out-Null
          Copy-Item $installer.FullName artifacts/desktop-independent-updater-bootstrap/MasterV_0.1.1_x64-setup.exe
          [ordered]@{
            status = "MASTERV_DESKTOP_INDEPENDENT_UPDATER_BOOTSTRAP_PASS"
            version = "0.1.1"
            source_sha = $env:SOURCE_SHA
            checkout_sha = $env:GITHUB_SHA
            channel = "stable"
            transport = "tauri-static-signed"
            cargo_feature = "independent-updater"
            installer_sha256 = $hash
            authenticode = "NotSigned"
            updater_client_integrated = $true
            updater_installed_launch_verified = $true
            updater_installed_uninstall_verified = $true
            subscription_independent = $true
            session_required = $false
            updater_artifact_created = $false
            update_release_published = $false
            automatic_install = $false
            signing_private_key_in_job = $false
            activation_allowed = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/desktop-independent-updater-bootstrap/bootstrap-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masterv-windows-independent-updater-bootstrap
          path: artifacts/desktop-independent-updater-bootstrap
          if-no-files-found: warn

name: Desktop Private Updater Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/session-bridge.js"
      - "desktop/updater.js"
      - "scripts/prepare-desktop-updater-bootstrap.mjs"
      - "scripts/desktop-private-updater-contract.mjs"
      - "scripts/desktop-private-updater-channel-smoke.mjs"
      - "src-tauri/src/main.rs"
      - "src-tauri/src/updater.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/tauri.windows-updater-bootstrap.conf.json"
      - ".github/workflows/desktop-private-updater-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-private-updater-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
  NEXT_PUBLIC_MASTERV_API_BASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1
  MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
  SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
  SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  bootstrap:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: npm ci
      - name: Verify locked updater dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps | Out-Null
      - name: Verify private updater static contract
        run: node scripts/desktop-private-updater-contract.mjs
      - name: Verify authenticated private channel is empty before activation
        run: node scripts/desktop-private-updater-channel-smoke.mjs
      - name: Build one-time updater bootstrap installer
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.windows-updater-bootstrap.conf.json
      - name: Verify bootstrap installer authority
        shell: pwsh
        run: |
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/MasterV_0.1.1_x64-setup.exe"
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") { throw "Bootstrap Authenticode status must remain NotSigned until Windows signing is explicitly activated" }
          $sigFiles = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.sig" -ErrorAction SilentlyContinue)
          if ($sigFiles.Count -ne 0) { throw "Bootstrap build must not create updater release artifacts" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path artifacts/desktop-private-updater-bootstrap | Out-Null
          Copy-Item $installer.FullName artifacts/desktop-private-updater-bootstrap/MasterV_0.1.1_x64-setup.exe
          [ordered]@{
            status = "MASTERV_DESKTOP_PRIVATE_UPDATER_BOOTSTRAP_PASS"
            version = "0.1.1"
            source_sha = $env:SOURCE_SHA
            checkout_sha = $env:GITHUB_SHA
            channel = "private-test"
            installer_sha256 = $hash
            authenticode = "NotSigned"
            updater_client_integrated = $true
            updater_artifact_created = $false
            update_release_published = $false
            automatic_install = $false
            signing_private_key_in_job = $false
            public_release = $false
            activation_allowed = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/desktop-private-updater-bootstrap/bootstrap-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: masterv-windows-private-updater-bootstrap
          path: artifacts/desktop-private-updater-bootstrap
          if-no-files-found: warn

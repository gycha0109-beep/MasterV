name: Desktop Release Readiness

on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to build as an unsigned release candidate
        required: false
        type: string
      allow_unsigned_rc:
        description: Explicitly allow building an unsigned release-candidate artifact only; this does not publish or activate it
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-readiness:
    if: ${{ github.event_name == 'pull_request' || inputs.allow_unsigned_rc == true }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WUdzeBz9jsYwQXP_YeyD4w_OdkRcLp2
      NEXT_PUBLIC_MASTERV_API_BASE_URL: https://euqkjrmrhhvnyzasppnd.supabase.co/functions/v1
      MASTERV_DESKTOP_REQUIRE_CONFIG: "1"
    steps:
      - name: Checkout PR synthetic merge authority
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout explicit exact-SHA authority
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Establish release source authority
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $requested = '${{ inputs.source_sha }}'.Trim()
            if ($requested -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be an exact 40-character commit SHA' }
            if ($actual -ne $requested) { throw "Exact-SHA checkout mismatch requested=$requested actual=$actual" }
            "MASTERV_RELEASE_SOURCE_SHA=$requested" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MASTERV_RELEASE_BASE_SHA=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MASTERV_RELEASE_SOURCE_AUTHORITY=explicit-exact-sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "MASTERV_RELEASE_SOURCE_SHA=${{ github.event.pull_request.head.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MASTERV_RELEASE_BASE_SHA=${{ github.event.pull_request.base.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MASTERV_RELEASE_SOURCE_AUTHORITY=pr-synthetic-merge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "MASTERV_RELEASE_CHECKOUT_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run test:desktop-build-determinism
      - run: npm run test:desktop-release-readiness
      - name: Verify locked Cargo graph
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps | Out-Null
      - name: Build native Windows release-candidate executable
        run: npm run desktop:build
      - name: Verify native build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Generate platform icons for release candidate
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build formal unsigned NSIS release candidate
        run: npm run desktop:bundle:windows-release-candidate
      - name: Verify release candidate build did not mutate lockfiles
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Require unsigned Authenticode state
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($installers.Count)" }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          $status = $signature.Status.ToString()
          if ($status -ne 'NotSigned') { throw "3M candidate must remain unsigned; Authenticode status=$status" }
          "MASTERV_RELEASE_SIGNATURE_STATUS=$status" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Audit and record release candidate evidence
        run: npm run test:desktop-release-candidate-audit-windows
      - name: Upload unsigned release-readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-release-readiness
          path: |
            artifacts/desktop-release-readiness
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

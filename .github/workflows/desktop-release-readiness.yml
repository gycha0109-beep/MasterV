name: Desktop Release Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character MasterV commit SHA to build as an unsigned release candidate
        required: true
        type: string
      allow_unsigned_rc:
        description: Explicitly allow building an unsigned release-candidate artifact only
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-readiness:
    if: ${{ inputs.allow_unsigned_rc == true }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify exact-SHA authority
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim(); $requested='${{ inputs.source_sha }}'.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$' -or $actual -ne $requested) { throw "Exact-SHA mismatch requested=$requested actual=$actual" }
      - run: npm ci
      - run: npm run test:exit-3-clean-cut
      - run: npm run test:desktop-shell
      - run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps
      - run: npm run desktop:build
      - run: npm run tauri -- icon src-tauri/icons/icon.png
      - run: npm run desktop:bundle:windows-release-candidate
      - name: Require unsigned candidate
        shell: pwsh
        run: |
          $installers=@(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one installer" }
          if ((Get-AuthenticodeSignature $installers[0].FullName).Status.ToString() -ne 'NotSigned') { throw "Unsigned readiness candidate unexpectedly signed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterv-windows-release-readiness
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

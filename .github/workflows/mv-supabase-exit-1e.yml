name: MV Supabase Exit 1E Independent Updater

on:
  pull_request:
  push:
    branches:
      - feat/mvp-foundation

permissions:
  contents: read

jobs:
  independent-updater:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: npm ci
      - name: Verify EXIT-1B closeout regression
        run: node scripts/desktop-provider-config-closeout-contract.mjs
      - name: Verify EXIT-1C stateless Gateway regression
        run: ./node_modules/.bin/tsx scripts/gateway-stateless-contract.ts
      - name: Verify EXIT-1D Product-Key / Polar regression
        run: ./node_modules/.bin/tsx scripts/gateway-polar-authority-contract.ts
      - name: Verify EXIT-1B-4 session cleanup regression
        run: node scripts/desktop-session-runtime-cleanup-contract.mjs
      - name: Verify EXIT-1B-5 build config regression
        run: node scripts/desktop-build-config-boundary-contract.mjs
      - name: Verify independent updater contract
        run: node scripts/desktop-independent-updater-contract.mjs
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify locked updater dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps >/dev/null
      - name: Verify independent updater source has no application authority dependency
        shell: bash
        run: |
          ! grep -RinE 'supabase|Authorization|apikey|access_token|product_key|POLAR_|GATEWAY_' \
            src-tauri/src/updater.rs \
            desktop/updater.js \
            scripts/prepare-desktop-updater-bootstrap.mjs \
            src-tauri/tauri.windows-updater-bootstrap.conf.json \
            src-tauri/tauri.windows-independent-updater-release.conf.json
      - name: Verify changed JavaScript syntax
        run: |
          node --check desktop/updater.js
          node --check scripts/prepare-desktop-updater-bootstrap.mjs
          node --check scripts/desktop-independent-updater-contract.mjs
          node --check scripts/desktop-independent-update-manifest.mjs
          node --check scripts/desktop-independent-updater-installed-launch-windows.mjs

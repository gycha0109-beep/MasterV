name: MV Supabase Exit 1D Product Key Polar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-key-polar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Verify EXIT-1C stateless Gateway regression
        run: ./node_modules/.bin/tsx scripts/gateway-stateless-contract.ts
      - name: Verify Product-Key / Polar authority contract
        run: ./node_modules/.bin/tsx scripts/gateway-polar-authority-contract.ts
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify canonical YouTube discovery regression
        run: npm run test:youtube-discovery
      - name: Verify canonical production guidance regression
        run: npm run test:single-video-production
      - name: Verify Gateway remains DB-less
        shell: bash
        run: |
          ! grep -RinE 'supabase|postgres|redis|sqlite|prisma|cloudflare[[:space:]]+d1' gateway
          ! grep -RinE 'reference_library_entries|background_batch_ledger' gateway
      - name: Verify no public Polar or signing secret config
        shell: bash
        run: |
          ! grep -RinE 'NEXT_PUBLIC_.*POLAR|NEXT_PUBLIC_.*SIGNING|VITE_.*POLAR|VITE_.*SIGNING' gateway

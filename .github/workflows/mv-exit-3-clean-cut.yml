name: MV EXIT-3 0.1.3 Clean Cut

on:
  pull_request:

concurrency:
  group: mv-exit-3-clean-cut-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Verify 0.1.3 zero-dependency authority
        run: npm run test:exit-3-clean-cut
      - name: Verify Desktop clean-cut shell
        run: npm run test:desktop-shell
      - name: Verify Gateway stateless authority
        run: npx tsx scripts/gateway-stateless-contract.ts
      - name: Verify Polar entitlement authority
        run: npx tsx scripts/gateway-polar-authority-contract.ts
      - name: Verify JavaScript syntax
        run: |
          node --check desktop/app.js
          node --check desktop/backend/provider-boundary.js
          node --check desktop/backend/backend.js
          node --check desktop/backend/bridge/transition-provider.js
          node --check desktop/backend/local/local-work-data-provider.js

  native-clean-cut:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run desktop:prepare
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify locked Cargo graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps
      - name: Verify local SQLite authority regression
        run: npm run test:desktop-local-persistence
      - name: Verify native Desktop compile
        run: npm run desktop:build
      - name: Verify Cargo lockfile unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock

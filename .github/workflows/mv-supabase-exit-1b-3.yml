name: MV Supabase Exit 1B-3 Remote Consumer Rewiring

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-consumer-rewire:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Verify provider foundation
        run: node scripts/desktop-backend-provider-contract.mjs
      - name: Verify app provider consumer regression
        run: node scripts/desktop-app-provider-rewire-contract.mjs
      - name: Verify remote consumer rewiring
        run: node scripts/desktop-remote-consumer-rewire-contract.mjs
      - name: Verify hosted Deep Analysis regression
        run: npm run test:hosted-deep-analysis
      - name: Verify hosted Production Guidance regression
        run: npm run test:hosted-production-guidance
      - name: Verify hosted Background Batch regression
        run: npm run test:hosted-background-batch
      - name: Verify Desktop shell regression
        run: npm run test:desktop-shell
      - name: Verify changed JavaScript syntax
        shell: bash
        run: |
          node --check desktop/backend/provider-boundary.js
          node --check desktop/backend/backend.js
          node --check desktop/production-guidance-renderer.js
          node --check desktop/deep-analysis.js
          node --check desktop/background-batch.js
          node --check scripts/build-desktop-static.mjs
          node --check scripts/desktop-app-provider-rewire-contract.mjs
          node --check scripts/desktop-remote-consumer-rewire-contract.mjs
          node --check scripts/hosted-deep-analysis-contract.mjs

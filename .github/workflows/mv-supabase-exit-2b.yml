name: MV Supabase Exit 2B Desktop Gateway Parallel Adapter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Verify EXIT-2A foundation regression
        run: node scripts/desktop-migration-bridge-foundation-contract.mjs
      - name: Verify EXIT-1C Gateway regression
        run: ./node_modules/.bin/tsx scripts/gateway-stateless-contract.ts
      - name: Verify EXIT-1D Product-Key / Polar regression
        run: ./node_modules/.bin/tsx scripts/gateway-polar-authority-contract.ts
      - name: Verify EXIT-1E updater regression
        run: node scripts/desktop-independent-updater-contract.mjs
      - name: Verify EXIT-2B parallel Desktop adapters
        run: node scripts/desktop-gateway-parallel-adapter-contract.mjs
      - name: Verify changed JavaScript syntax
        run: |
          node --check desktop/backend/gateway/gateway-session-provider.js
          node --check desktop/backend/gateway/gateway-remote-provider.js
          node --check desktop/backend/local/local-work-data-provider.js
          node --check desktop/backend/bridge/transition-provider.js
          node --check scripts/desktop-gateway-parallel-adapter-contract.mjs

  native-transport:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Prepare Desktop assets
        run: npm run desktop:prepare
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify locked Cargo graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps
      - name: Verify Gateway transport tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml gateway_transport -- --nocapture
      - name: Verify SQLite authority regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml local_persistence -- --nocapture
      - name: Verify secure device regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml device_secure_store -- --nocapture
      - name: Verify native Desktop compile
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify Cargo lockfile is unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock

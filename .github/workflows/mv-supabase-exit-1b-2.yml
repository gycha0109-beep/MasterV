name: MV Supabase Exit 1B-2 App Provider Rewiring

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mv-supabase-exit-1b-2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-provider-rewire:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Verify 1B-1 provider foundation
        run: node scripts/desktop-backend-provider-contract.mjs
      - name: Verify 1B-2 app provider rewiring
        run: node scripts/desktop-app-provider-rewire-contract.mjs
      - name: Verify Desktop shell regression
        run: npm run test:desktop-shell
      - name: Verify Reference Library regression
        run: npm run test:desktop-reference-library
      - name: Verify Reference Detail Compare regression
        run: npm run test:desktop-reference-detail-compare
      - name: Verify hosted Reference compiler regression
        run: npm run test:hosted-reference-compiler
      - name: Verify hosted YouTube discovery regression
        run: npm run test:hosted-youtube-discovery
      - name: Verify changed JavaScript syntax
        shell: bash
        run: |
          node --check desktop/app.js
          node --check desktop/backend/provider-boundary.js
          node --check desktop/backend/backend.js
          node --check desktop/backend/legacy/supabase-session-provider.js
          node --check desktop/backend/legacy/supabase-work-data-provider.js
          node --check desktop/backend/legacy/hosted-api-client.js

name: Probe MV EXIT 1A Cargo Lock

on:
  pull_request:
  push:
    branches:
      - feat/mvp-foundation

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Resolve lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Verify dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null
      - name: Verify rusqlite build
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mv-exit-1a-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1

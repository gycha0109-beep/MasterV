name: Probe MV EXIT 1A Cargo Lock

on:
  pull_request:
  push:
    branches:
      - feat/mvp-foundation

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/mvp-foundation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install Node dependencies
        run: npm ci
      - name: Prepare desktop assets
        run: npm run desktop:prepare
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Resolve lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Verify dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null
      - name: Verify local persistence native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml local_persistence -- --nocapture
      - name: Commit Cargo-generated lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already authoritative"
          else
            git commit -m "chore(exit-1a): lock local sqlite dependencies"
            git push origin HEAD:feat/mvp-foundation
          fi
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mv-exit-1a-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1

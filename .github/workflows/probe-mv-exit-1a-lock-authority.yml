name: Probe MV EXIT 1A Native SQLite

on:
  push:
    branches:
      - probe/mv-exit-1a-lock-authority

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: probe/mv-exit-1a-lock-authority
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run desktop:prepare
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify locked graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null
      - name: Run local persistence native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml local_persistence -- --nocapture

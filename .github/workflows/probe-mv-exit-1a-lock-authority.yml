name: Probe MV EXIT 1A Lock Authority

on:
  push:
    branches:
      - probe/mv-exit-1a-lock-authority

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: probe/mv-exit-1a-lock-authority
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Verify locked graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null
      - name: Commit Cargo-generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(exit-1a): lock local sqlite dependencies"
          git push origin HEAD:probe/mv-exit-1a-lock-authority

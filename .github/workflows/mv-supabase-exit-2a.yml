name: MV Supabase Exit 2A Local Authority Secure Device

on:
  pull_request:
  push:
    branches:
      - feat/mvp-foundation

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Verify EXIT-1A SQLite foundation regression
        run: npm run test:desktop-local-persistence
      - name: Verify EXIT-1E updater independence regression
        run: node scripts/desktop-independent-updater-contract.mjs
      - name: Verify EXIT-2A migration bridge foundation
        run: node scripts/desktop-migration-bridge-foundation-contract.mjs
      - name: Verify changed script syntax
        run: |
          node --check scripts/desktop-local-persistence-contract.mjs
          node --check scripts/desktop-migration-bridge-foundation-contract.mjs

  native-authority:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Prepare Desktop assets
        run: npm run desktop:prepare
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Verify locked Cargo graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps
      - name: Run SQLite authority tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml local_persistence -- --nocapture
      - name: Run secure device store tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml device_secure_store -- --nocapture
      - name: Verify bridge native compile
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify Cargo lockfile is unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock

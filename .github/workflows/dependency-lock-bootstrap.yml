name: Dependency Lock Bootstrap

on:
  pull_request:
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - .github/workflows/dependency-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lockfiles:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: masterv-dependency-lock-bootstrap
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Commit lockfiles and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git rm .github/workflows/dependency-lock-bootstrap.yml
          git commit -m "build(arch3k): lock npm and Cargo dependency graphs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
